<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101521">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mon entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #EEF0F5; --surface: #FFFFFF; --surface2: #E4E8F0; --ink: #101521; --muted: #566075; --line: #D2D8E3;
  --accent: #2340E0; --ok: #137A4B; --warn: #A25E04; --bad: #B3321F; --on: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1018; --surface: #151A25; --surface2: #202738; --ink: #EDF0F7; --muted: #9AA3B8; --line: #2A3245;
    --accent: #8EA2FF; --ok: #5BD494; --warn: #F0A843; --bad: #FF8A7A; --on: #0D1018; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1018; --surface: #151A25; --surface2: #202738; --ink: #EDF0F7; --muted: #9AA3B8; --line: #2A3245;
  --accent: #8EA2FF; --ok: #5BD494; --warn: #F0A843; --bad: #FF8A7A; --on: #0D1018; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; }
.eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 0; font: 700 clamp(38px, 10vw, 56px)/.92 var(--display); text-transform: uppercase; }
h2 { margin: 0; font: 700 26px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.prog { margin-top: 14px; display: grid; gap: 6px; }
.prog .lab { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .lab b { color: var(--ink); }
.track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ok); transition: width .25s ease; }
.days { position: sticky; top: 0; z-index: 4; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 18px 0 0; padding: 4px; background: var(--surface2); border-radius: 10px; }
.days button { min-height: 52px; border: 0; background: transparent; border-radius: 7px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.days button small { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.days button[aria-pressed="true"] small { color: inherit; opacity: .75; }
.days button.full small { color: var(--ok); }
.days button.full[aria-pressed="true"] small { color: inherit; }
.dayhead { margin: 20px 0 12px; display: flex; flex-direction: column; gap: 4px; }
.dayhead p { margin: 0; color: var(--muted); font-size: 14px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 16px; }
.card.done { border-color: var(--ok); }
.ex h3 { margin: 0; font-size: 18px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.ex h3 .n { font: 700 18px var(--display); color: var(--muted); }
.meta { margin: 4px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 600; }
.load { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; font-size: 22px; font-weight: 600; line-height: 1; }
.kg { display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid var(--line); padding: 0 2px; }
.kg:focus-within { border-color: var(--accent); }
.kg input { width: 4ch; border: 0; background: transparent; font: 700 34px/1.05 var(--display); text-align: center; outline: none; padding: 0; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
.kg input::-webkit-outer-spin-button, .kg input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.kg span { font-size: 14px; color: var(--muted); white-space: nowrap; }
.shared { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.shared b { color: var(--accent); font-weight: 600; }
.sets { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.set { display: flex; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.set.on { background: var(--ok); border-color: var(--ok); color: var(--on); }
.set button { flex: none; width: 36px; height: 36px; border: 1.5px solid currentColor; border-radius: 6px; background: transparent; display: grid; place-items: center; padding: 0; }
.set.on button { background: var(--on); color: var(--ok); border-color: var(--on); }
.set button svg { width: 18px; height: 18px; visibility: hidden; }
.set.on button svg { visibility: visible; }
.set label { display: flex; align-items: baseline; gap: 3px; font-size: 13px; min-width: 0; }
.set input { width: 3ch; border: 0; border-bottom: 1.5px solid currentColor; background: transparent; font: 700 20px/1 var(--display); text-align: center; padding: 0; outline: none; -moz-appearance: textfield; color: inherit; }
.set input::placeholder { color: inherit; opacity: .45; }
.set input::-webkit-outer-spin-button, .set input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hint { margin: 12px 0 0; padding-left: 10px; border-left: 3px solid var(--ok); font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hint .cta { min-height: 36px; padding: 4px 12px; }
.histo { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.cta { min-height: 44px; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 600; }
.mini { min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); background: transparent; border-radius: 6px; font-size: 14px; color: var(--muted); }
.mini:hover { color: var(--ink); border-color: var(--ink); }
.foot { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tip { margin: 0; font-size: 14px; color: var(--muted); }
.flash { margin: 0; font-size: 14px; color: var(--ok); }
.flash.err { color: var(--bad); }
/* Minuteur de repos */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--bg);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer .t { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.timer .l { font-size: 13px; opacity: .75; }
.timer.end { background: var(--ok); color: var(--on); }
.timer .btns { display: flex; gap: 8px; }
.timer button { min-height: 44px; padding: 6px 14px; border: 0; border-radius: 8px; background: var(--bg); color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Programme · 5 séances</p>
    <h1>Mon entraînement</h1>
    <div class="prog" id="prog"></div>
  </header>
  <nav class="days" id="days" aria-label="Jours"></nav>
  <div class="dayhead" id="dayhead"></div>
  <main class="list" id="list" aria-live="polite"></main>
  <section class="foot" aria-label="Semaine et sauvegarde">
    <div class="actions"><button class="mini" type="button" id="newweek">Nouvelle semaine</button><span class="tip" id="nwtip">Décoche toutes les séries, garde les charges.</span></div>
    <p class="tip">Une charge modifiée change partout où l'exercice revient dans la semaine. Tout reste sur ce téléphone.</p>
    <div class="actions"><button class="mini" type="button" id="bexp">Exporter une sauvegarde</button><button class="mini" type="button" id="bimp">Importer</button></div>
    <input type="file" id="fimp" accept="application/json,.json" hidden>
    <p class="flash" id="bflash" role="status"></p>
  </section>
</div>
<div class="timer" id="timer" hidden></div>

<script>
(function () {
  'use strict';
  /* ---------- Exercices : la charge est stockée une seule fois par exercice ---------- */
  var EX = {
    chest: { name: 'Chest press machine', load: 40, step: 2.5, unit: 'kg' },
    chestlight: { name: 'Chest press léger', load: 30, step: 2.5, unit: 'kg' },
    incline: { name: 'Développé incliné haltères', load: 12, step: 1, unit: 'kg / haltère' },
    pulldown: { name: 'Tirage vertical (lat pulldown)', load: 35, step: 2.5, unit: 'kg' },
    row: { name: 'Rowing poulie assis', load: 35, step: 2.5, unit: 'kg' },
    lateral: { name: 'Élévations latérales haltères', load: 5, step: 1, unit: 'kg / haltère' },
    triceps: { name: 'Extension triceps à la poulie', load: 15, step: 2.5, unit: 'kg' },
    curl: { name: 'Curl biceps à la poulie (barre)', load: 15, step: 2.5, unit: 'kg' },
    hammer: { name: 'Curl marteau à la corde', load: 15, step: 2.5, unit: 'kg' },
    wrist: { name: 'Flexions des poignets haltères', load: null, step: 1, unit: 'kg / haltère' },
    crunch: { name: 'Crunch à la poulie à genoux', load: null, step: 2.5, unit: 'kg' },
    reardelt: { name: 'Oiseau haltères', load: 5, step: 1, unit: 'kg / haltère' },
    goblet: { name: 'Goblet squat', load: null, step: 2, unit: 'kg' },
    legcurl: { name: 'Leg curl allongé', load: 23, step: 2.5, unit: 'kg' },
    revcrunch: { name: 'Reverse crunch', load: null, step: 0, unit: '' }
  };
  function it(ex, sets, reps, rest, restS) { return { ex: ex, sets: sets, reps: reps, rest: rest, restS: restS }; }
  var PROG = [
    { k: 'lun', d: 'Lundi', t: 'Haut du corps A', items: [
      it('chest', 4, '6–10', '2–3 min', 150), it('incline', 3, '8–12', '2 min', 120), it('pulldown', 3, '8–12', '2 min', 120),
      it('row', 3, '8–12', '2 min', 120), it('lateral', 3, '12–20', '60–90 s', 75), it('triceps', 2, '10–15', '60–90 s', 75)] },
    { k: 'mar', d: 'Mardi', t: 'Bras, avant-bras et abdos', items: [
      it('curl', 3, '8–12', '90 s', 90), it('hammer', 3, '10–15', '90 s', 90), it('wrist', 2, '12–20', '60 s', 60),
      it('triceps', 3, '10–15', '60–90 s', 75), it('crunch', 3, '10–15', '60–90 s', 75)] },
    { k: 'mer', d: 'Mercredi', t: 'Haut du corps B', items: [
      it('pulldown', 3, '8–12', '2 min', 120), it('row', 3, '8–12', '2 min', 120), it('reardelt', 3, '12–20', '60–90 s', 75),
      it('curl', 3, '8–12', '90 s', 90), it('wrist', 2, '12–20', '60 s', 60)] },
    { k: 'jeu', d: 'Jeudi', t: 'Pecs, épaules, triceps et abdos', items: [
      it('chest', 3, '8–12', '2 min', 120), it('lateral', 3, '12–20', '60–90 s', 75), it('triceps', 3, '10–15', '60–90 s', 75),
      it('crunch', 3, '10–15', '60–90 s', 75)] },
    { k: 'ven', d: 'Vendredi', t: 'Jambes, pecs léger et abdos', items: [
      it('goblet', 3, '8–12', '2 min', 120), it('legcurl', 3, '10–15', '90 s', 90), it('chestlight', 2, '10–12', '90 s', 90),
      it('revcrunch', 3, '12–15', '60–90 s', 75), it('crunch', 3, '10–15', '60–90 s', 75)] }
  ];
  /* Séries déjà cochées cette semaine au moment de la création de l'appli */
  var START_DONE = { lun: [3, 3, 3, 3, 3, 2], mer: [3, 3, 3, 2, 2], jeu: [3, 3, 3, 2] };

  /* ---------- État ---------- */
  var KEY = 'muscu-v1';
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  var S = lsGet(KEY);
  if (!S || typeof S !== 'object') {
    S = { loads: {}, done: {}, hist: {}, week: today() };
    Object.keys(START_DONE).forEach(function (d) { START_DONE[d].forEach(function (n, i) { for (var s = 0; s < n; s++) S.done[d + '.' + i + '.' + s] = { c: true }; }); });
  }
  S.loads = S.loads || {}; S.done = S.done || {}; S.hist = S.hist || {};
  var DAYKEYS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
  var cur = (function () { var k = DAYKEYS[new Date().getDay()]; return PROG.some(function (p) { return p.k === k; }) ? k : 'lun'; })();
  var nwArm = false, timer = null;
  function save() { lsSet(KEY, S); }
  function today() { var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function nf(n) { return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }); }
  function load(ex) { return Object.prototype.hasOwnProperty.call(S.loads, ex) ? S.loads[ex] : EX[ex].load; }
  function days(ex) { return PROG.filter(function (p) { return p.items.some(function (x) { return x.ex === ex; }); }).map(function (p) { return p.d.toLowerCase(); }); }
  function maxReps(r) { var m = String(r).match(/(\d+)\D*$/); return m ? +m[1] : 0; }
  function dayCount(p) { var t = 0, d = 0; p.items.forEach(function (x, i) { for (var s = 0; s < x.sets; s++) { t++; if ((S.done[p.k + '.' + i + '.' + s] || {}).c) d++; } }); return { t: t, d: d }; }

  /* Change la charge d'un exercice : une seule valeur, donc partout dans la semaine */
  function setLoad(ex, v) {
    v = v == null || v === '' || isNaN(v) ? null : Math.max(0, Math.round(v * 100) / 100);
    var old = load(ex); if (old === v) return;
    S.loads[ex] = v;
    if (v != null) { var h = S.hist[ex] || (S.hist[ex] = []), t = today(); if (!h.length && old != null) h.push({ d: '0', v: old }); if (h.length && h[h.length - 1].d === t) h[h.length - 1].v = v; else h.push({ d: t, v: v }); if (h.length > 30) h.shift(); }
    save();
  }

  /* ---------- Rendu ---------- */
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function render() {
    var tot = 0, dn = 0;
    PROG.forEach(function (p) { var c = dayCount(p); tot += c.t; dn += c.d; });
    $('#prog').innerHTML = '<div class="lab"><span>Semaine</span><span><b>' + dn + '</b> / ' + tot + ' séries</span></div><div class="track"><i style="width:' + (tot ? dn / tot * 100 : 0) + '%"></i></div>';
    $('#days').innerHTML = PROG.map(function (p) {
      var c = dayCount(p);
      return '<button type="button" data-d="' + p.k + '" aria-pressed="' + (p.k === cur) + '" class="' + (c.d === c.t ? 'full' : '') + '">' + p.d.slice(0, 3) + '<small>' + (c.d === c.t ? '✓' : c.d + '/' + c.t) + '</small></button>';
    }).join('');
    var P = PROG.filter(function (p) { return p.k === cur; })[0], c = dayCount(P);
    $('#dayhead').innerHTML = '<h2>' + P.d + '</h2><p>' + esc(P.t) + ' · ' + c.d + ' / ' + c.t + ' séries</p>';
    $('#list').innerHTML = P.items.map(function (x, i) {
      var e = EX[x.ex], L = load(x.ex), other = days(x.ex).filter(function (d) { return d !== P.d.toLowerCase(); });
      var sets = '', all = true, top = true, mr = maxReps(x.reps);
      for (var s = 0; s < x.sets; s++) {
        var st = S.done[P.k + '.' + i + '.' + s] || {};
        if (!st.c) all = false; if (!(st.r >= mr)) top = false;
        sets += '<div class="set' + (st.c ? ' on' : '') + '" data-i="' + i + '" data-s="' + s + '"><button type="button" aria-pressed="' + !!st.c + '" aria-label="Série ' + (s + 1) + (st.c ? ' faite' : ' à faire') + '">' + CHECK + '</button>' +
          '<label>S' + (s + 1) + ' <input type="number" inputmode="numeric" min="0" max="99" value="' + (st.r || '') + '" placeholder="' + mr + '" aria-label="Répétitions série ' + (s + 1) + '"> reps</label></div>';
      }
      var h = '<article class="card ex' + (all ? ' done' : '') + '" data-ex="' + x.ex + '"><h3><span class="n">' + (i + 1) + '</span>' + esc(e.name) + '</h3>' +
        '<p class="meta"><b>' + x.sets + ' × ' + x.reps + '</b> · repos ' + x.rest + '</p>';
      if (e.step) {
        h += '<div class="load"><button type="button" class="step" data-l="-" aria-label="Baisser la charge">−</button><div class="kg"><input type="text" inputmode="decimal" autocomplete="off" value="' + (L == null ? '' : String(L).replace('.', ',')) + '" placeholder="–" aria-label="Charge : ' + esc(e.name) + '"><span>' + e.unit + '</span></div><button type="button" class="step" data-l="+" aria-label="Monter la charge">+</button>' +
          (other.length ? '<span class="shared">Même charge <b>' + other.join(', ') + '</b></span>' : '') + '</div>';
      } else h += '<p class="meta" style="margin-top:8px">Poids du corps</p>';
      h += '<div class="sets">' + sets + '</div>';
      if (all && top && e.step && L != null) h += '<p class="hint">Toutes les séries à ' + mr + ' reps : tu peux monter. <button type="button" class="cta" data-up="1">+' + nf(e.step) + ' kg</button></p>';
      var hs = (S.hist[x.ex] || []).slice(-4);
      if (hs.length > 1) h += '<p class="histo">Évolution : ' + hs.map(function (y) { return nf(y.v); }).join(' → ') + ' ' + e.unit.replace(' / haltère', '') + '</p>';
      return h + '</article>';
    }).join('');
    $('#newweek').textContent = nwArm ? 'Confirmer : décocher toute la semaine' : 'Nouvelle semaine';
    $('#newweek').className = nwArm ? 'cta' : 'mini';
  }

  /* ---------- Minuteur de repos ---------- */
  function startTimer(sec, label) {
    stopTimer(); var end = Date.now() + sec * 1000, el = $('#timer'); el.hidden = false;
    function tick() {
      var r = Math.max(0, Math.round((end - Date.now()) / 1000)), m = Math.floor(r / 60), s = r % 60;
      el.className = 'timer' + (r === 0 ? ' end' : '');
      el.innerHTML = '<div><div class="t">' + (r === 0 ? 'Go !' : m + ':' + (s < 10 ? '0' : '') + s) + '</div><div class="l">' + (r === 0 ? 'Repos terminé' : 'Repos · ' + esc(label)) + '</div></div>' +
        '<div class="btns">' + (r ? '<button type="button" data-t="add">+30 s</button>' : '') + '<button type="button" data-t="stop">' + (r ? 'Passer' : 'OK') + '</button></div>';
      if (r === 0) { clearInterval(timer.id); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    }
    timer = { end: end, id: setInterval(tick, 500), label: label }; tick();
  }
  function stopTimer() { if (timer) clearInterval(timer.id); timer = null; $('#timer').hidden = true; }
  $('#timer').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b || !timer) return;
    if (b.getAttribute('data-t') === 'add') { var r = Math.max(0, timer.end - Date.now()) / 1000 + 30, l = timer.label; startTimer(r, l); } else stopTimer();
  });

  /* ---------- Événements ---------- */
  $('#days').addEventListener('click', function (e) { var b = e.target.closest('[data-d]'); if (!b) return; cur = b.getAttribute('data-d'); nwArm = false; render(); window.scrollTo({ top: 0 }); });
  $('#list').addEventListener('click', function (e) {
    var card = e.target.closest('.ex'); if (!card) return;
    var ex = card.getAttribute('data-ex'), P = PROG.filter(function (p) { return p.k === cur; })[0];
    var st = e.target.closest('[data-l]');
    if (st) { var L = load(ex), step = EX[ex].step; setLoad(ex, Math.max(0, (L == null ? 0 : L) + (st.getAttribute('data-l') === '+' ? step : -step))); render(); return; }
    if (e.target.closest('[data-up]')) { setLoad(ex, (load(ex) || 0) + EX[ex].step); render(); return; }
    var sb = e.target.closest('.set button'); if (!sb) return;
    var box = sb.closest('.set'), i = +box.getAttribute('data-i'), s = +box.getAttribute('data-s'), k = cur + '.' + i + '.' + s, o = S.done[k] || {};
    o.c = !o.c; S.done[k] = o; save(); render();
    if (o.c) {
      var x = P.items[i], last = !P.items.slice(i).some(function (y, j) { for (var z = 0; z < y.sets; z++) if (!(S.done[cur + '.' + (i + j) + '.' + z] || {}).c) return true; return false; });
      if (!last) startTimer(x.restS, EX[x.ex].name); else stopTimer();
    }
  });
  $('#list').addEventListener('change', function (e) {
    var card = e.target.closest('.ex'); if (!card) return; var ex = card.getAttribute('data-ex');
    if (e.target.closest('.kg')) { var v = parseFloat(String(e.target.value).replace(',', '.')); setLoad(ex, isNaN(v) ? null : v); render(); return; }
    var box = e.target.closest('.set'); if (!box) return;
    var k = cur + '.' + box.getAttribute('data-i') + '.' + box.getAttribute('data-s'), o = S.done[k] || {}, r = parseInt(e.target.value, 10);
    if (isNaN(r) || r <= 0) delete o.r; else { o.r = Math.min(r, 99); o.c = true; }
    S.done[k] = o; save(); render();
  });
  $('#newweek').addEventListener('click', function () {
    if (!nwArm) { nwArm = true; render(); return; }
    nwArm = false; S.done = {}; S.week = today(); save(); stopTimer(); render(); window.scrollTo({ top: 0 });
  });
  function bmsg(t, err) { var el = $('#bflash'); el.className = 'flash' + (err ? ' err' : ''); el.textContent = t; }
  $('#bexp').addEventListener('click', async function () {
    var name = 'muscu-sauvegarde-' + today() + '.json', txt = JSON.stringify({ app: 'muscu', v: 1, data: S });
    try { var f = new File([txt], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Sauvegarde muscu' }); bmsg('Choisis « Enregistrer dans Fichiers » pour la garder.'); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); bmsg('Fichier ' + name + ' téléchargé.');
  });
  $('#bimp').addEventListener('click', function () { $('#fimp').click(); });
  $('#fimp').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () {
      var d; try { d = JSON.parse(rd.result); } catch (x) { d = null; }
      if (!d || d.app !== 'muscu' || !d.data) { bmsg('Ce fichier n\'est pas une sauvegarde de l\'appli muscu.', true); return; }
      S = d.data; S.loads = S.loads || {}; S.done = S.done || {}; S.hist = S.hist || {}; save(); render(); bmsg('Sauvegarde importée.');
    };
    rd.readAsText(f); e.target.value = '';
  });
  render();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
