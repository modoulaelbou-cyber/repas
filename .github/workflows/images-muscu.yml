# Tâche temporaire : cherche et télécharge des images libres (Wikimedia Commons)
name: Images muscu
on:
  push:
    paths: ['muscu/img/search.txt']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chercher et télécharger
        run: |
          UA="RepasMuscuApp/1.0 (https://github.com/modoulaelbou-cyber/repas)"
          mkdir -p muscu/img/raw; : > muscu/img/report.txt
          while IFS='|' read -r tag q; do
            [ -z "$tag" ] && continue
            curl -fsSL -A "$UA" --get "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "list=search" --data-urlencode "srnamespace=6" --data-urlencode "srlimit=8" --data-urlencode "format=json" --data-urlencode "srsearch=$q" \
              | jq -r '.query.search[].title' | sed 's/^File://' > /tmp/t.txt || true
            n=0
            while read -r f; do
              n=$((n+1)); out="$tag-$n"
              echo "$out | $f" >> muscu/img/report.txt
              curl -fsSL -A "$UA" "https://commons.wikimedia.org/wiki/Special:FilePath/$(jq -rn --arg s "$f" '$s|@uri')?width=480" -o "muscu/img/raw/$out" || echo "FAIL $out" >> muscu/img/report.txt
              sleep 1
            done < /tmp/t.txt
          done < muscu/img/search.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscu/img
          git diff --cached --quiet || git commit -m "Images candidates muscu"
          git push
