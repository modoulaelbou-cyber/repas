# Télécharge les images libres (Wikimedia Commons) listées dans muscu/img/list.txt
# et les enregistre dans le dépôt, pour que l'appli muscu les affiche sans connexion.
name: Images muscu
on:
  push:
    paths: ['muscu/img/list.txt', '.github/workflows/images-muscu.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et convertir
        run: |
          set -u
          UA="RepasMuscuApp/1.0 (https://github.com/modoulaelbou-cyber/repas)"
          : > muscu/img/report.txt
          while IFS='|' read -r name file; do
            [ -z "$name" ] && continue
            url="https://commons.wikimedia.org/wiki/Special:FilePath/${file}?width=480"
            if curl -fsSL -A "$UA" "$url" -o "/tmp/$name.src"; then
              convert "/tmp/$name.src[0]" -background white -alpha remove -resize '480x480>' -quality 80 "muscu/img/$name.jpg" && echo "OK $name $file" >> muscu/img/report.txt || echo "CONVERT-FAIL $name $file" >> muscu/img/report.txt
            else
              echo "DOWNLOAD-FAIL $name $file" >> muscu/img/report.txt
            fi
            sleep 1
          done < muscu/img/list.txt
          cat muscu/img/report.txt
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscu/img
          git diff --cached --quiet || git commit -m "Images muscu téléchargées depuis Wikimedia Commons"
          git push
